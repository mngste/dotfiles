# ~/.config/kitty/ssh.conf — utilisé par `kitten ssh` (alias ssh dans .zshrc)
#
# Pour TOUS les hôtes, kitten ssh copie automatiquement le terminfo de kitty
# et active l'intégration shell. Rien d'autre n'est copié par défaut.
#
# Pour les machines du homelab, on ajoute en plus quelques fichiers légers
# (voir ssh-homelab.conf). Le motif est comparé au nom TAPÉ : `ssh 192.168.1.30`,
# `ssh nas`... (pas à l'IP derrière un alias de ~/.ssh/config).

hostname 192.168.*
include ssh-homelab.conf

# Noms d'hôtes privés : ~/.config/kitty/ssh-hosts.conf, NON versionné.
# Ignoré s'il n'existe pas. Exemple de contenu :
#   hostname proxmox1 docker nas
#   include ssh-homelab.conf
include ssh-hosts.conf
