# Fichiers copiés sur les machines du homelab à chaque connexion kitten ssh.
# Les chemins source sont relatifs à ton $HOME local, --dest au $HOME distant.
# Rien n'est écrasé : tout va dans ~/.config/kitty-remote/, sauf .bash_aliases.

# Alias et EDITOR communs (bash et zsh)
copy --dest .config/kitty-remote/shrc .config/kitty/remote/shrc

# bash : ~/.bash_aliases est lu par le .bashrc par défaut de Debian
copy --dest .bash_aliases .config/kitty/remote/bash_aliases

# zsh (si c'est le shell du serveur) : .zshrc léger chargé via ZDOTDIR,
# il charge aussi le ~/.zshrc du serveur s'il existe
copy --dest .config/kitty-remote/zsh/.zshrc .config/kitty/remote/zsh/.zshrc
env ZDOTDIR=$HOME/.config/kitty-remote/zsh

# Config Helix : utilisée seulement si hx est installé sur le serveur
copy .config/helix/config.toml
