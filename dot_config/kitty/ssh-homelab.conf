# Fichiers copiés sur les machines du homelab à chaque connexion.
# Les chemins source sont relatifs à ton $HOME local, --dest au $HOME distant.

# Alias et prompt : ~/.bash_aliases est lu par le .bashrc par défaut de Debian,
# donc on n'écrase pas le .bashrc du serveur.
copy --dest .bash_aliases .config/kitty/remote/bash_aliases

# Config Helix : utilisée seulement si hx est installé sur le serveur.
copy .config/helix/config.toml
