# ~/.config/kitty/kitty.conf — remplace ghostty (mêmes réglages et raccourcis)

# ── Apparence ──────────────────────────────────────────────
include themes/tokyonight_night.conf
font_family      JetBrainsMono Nerd Font
font_size        12.0
background_opacity 0.9
hide_window_decorations yes
window_padding_width 0
tab_bar_edge     bottom
tab_bar_style    powerline
cursor_trail     1

# ── Comportement ───────────────────────────────────────────
shell                    zsh
shell_integration        no-title
copy_on_select           clipboard
paste_actions            quote-urls-at-prompt
remember_window_size     yes
confirm_os_window_close  0
enable_audio_bell        no
enabled_layouts          splits,stack

# ── Onglets ────────────────────────────────────────────────
map super+left       previous_tab
map super+right      next_tab
map super+shift+t    set_tab_title
# nouvel onglet : ctrl+shift+t (défaut)

# ── Splits (mêmes touches que ghostty) ─────────────────────
map ctrl+shift+j launch --location=hsplit --cwd=current
map ctrl+shift+l launch --location=vsplit --cwd=current
map ctrl+shift+k combine : launch --location=hsplit --cwd=current : move_window up
map ctrl+shift+h combine : launch --location=vsplit --cwd=current : move_window left

map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

# plein écran du split courant (on/off)
map ctrl+shift+z toggle_layout stack
# fermer le split : ctrl+shift+w (défaut)

# ── Divers ─────────────────────────────────────────────────
map ctrl+shift+r load_config_file
