# Écrans : mêmes positions que niri (output.kdl). Un écran absent est ignoré.
# L'écran externe est désigné par "marque modèle série" : la config suit l'écran
# quel que soit le port (HDMI, DP, USB-C, dock...).
# Infos des écrans : swaymsg -t get_outputs
#
# Disposition : externe en haut, portable juste en dessous, centré.
#   externe 4K scale 1.25 = 3072x1728 logiques -> pos 0 0
#   portable 1920x1080 -> x = (3072-1920)/2 = 576, y = 1728
set $ext "Lenovo Group Limited 27U-10 UR339CX0"
set $laptop eDP-1

output $ext mode 3840x2160@59.997Hz scale 1.25 pos 0 0
output $laptop mode 1920x1080@60.008Hz scale 1 pos 576 1728

# Espaces de travail attribués aux écrans (le 2e écran sert de repli s'il manque).
# Le 2 (kitty) va sur le portable, les autres sur l'externe.
workspace 1 output $ext $laptop
workspace 2 output $laptop $ext
workspace 3 output $ext $laptop
workspace 4 output $ext $laptop
