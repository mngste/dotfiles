# Raccourcis perso, alignés sur niri (bind.kdl).
# --no-warn : remplace sans avertissement les raccourcis de la config Fedora.
# Les autres raccourcis restent ceux de Sway : Mod+h/j/k/l, Mod+1..9, etc.

bindsym --no-warn $mod+Return exec kitty
bindsym --no-warn $mod+d exec fuzzel
bindsym --no-warn $mod+b exec firefox
bindsym --no-warn $mod+e exec thunar
bindsym --no-warn $mod+q kill
# Revenir à l'espace précédent (aller-retour entre deux espaces)
bindsym --no-warn $mod+Tab workspace back_and_forth
bindsym --no-warn $mod+Alt+l exec swaylock -f
# Menu verrouiller / déconnexion / veille / redémarrer / éteindre
bindsym --no-warn $mod+Shift+e exec ~/.local/bin/menu-alimentation


# Écrans (externe à gauche, portable à droite)
#   Super+Ctrl+flèche          passer sur l'écran
#   Super+Ctrl+Shift+flèche    envoyer la fenêtre (et la suivre)
#   Super+Alt+Shift+flèche     envoyer tout l'espace de travail
bindsym --no-warn $mod+Ctrl+Left focus output left
bindsym --no-warn $mod+Ctrl+Right focus output right
bindsym --no-warn $mod+Ctrl+Shift+Left move container to output left, focus output left
bindsym --no-warn $mod+Ctrl+Shift+Right move container to output right, focus output right
bindsym --no-warn $mod+Alt+Shift+Left move workspace to output left
bindsym --no-warn $mod+Alt+Shift+Right move workspace to output right
