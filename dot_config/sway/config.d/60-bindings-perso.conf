# Raccourcis perso, alignés sur niri (bind.kdl).
# --no-warn : remplace sans avertissement les raccourcis de la config Fedora.
# Les autres raccourcis restent ceux de Sway : Mod+h/j/k/l, Mod+1..9, etc.

bindsym --no-warn $mod+Return exec kitty
bindsym --no-warn $mod+d exec fuzzel
bindsym --no-warn $mod+b exec firefox
bindsym --no-warn $mod+e exec thunar
bindsym --no-warn $mod+q kill
bindsym --no-warn $mod+Alt+l exec swaylock -f

# Captures d'écran (~/.local/bin/capture) : fichier dans ~/Images/Captures
# et copie dans le presse-papiers
bindsym --no-warn Print exec capture zone
bindsym --no-warn Shift+Print exec capture ecran
bindsym --no-warn $mod+Print exec capture fenetre
