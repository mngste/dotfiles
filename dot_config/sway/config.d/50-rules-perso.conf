# Applis rangées sur un espace de travail fixe.
# On y bascule aussi, pour voir la fenêtre qu'on vient d'ouvrir.
# app_id d'une fenêtre : swaymsg -t get_tree | grep app_id

# Firefox (paquet Fedora ou Flatpak) -> 1
for_window [app_id="^(firefox|org\.mozilla\.firefox)$"] move container to workspace number 1, workspace number 1

# kitty -> 2
for_window [app_id="^kitty$"] move container to workspace number 2, workspace number 2
