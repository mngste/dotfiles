# Clavier et touchpad : mêmes réglages que niri (input.kdl).
# Les fichiers de ce dossier complètent la config Fedora (/usr/share/sway/config.d/).
# Un fichier qui porte le même nom qu'un fichier Fedora le remplace.

input type:keyboard {
    xkb_layout us,us
    xkb_variant ,intl
    xkb_options grp:win_space_toggle,ctrl:nocaps
    xkb_numlock enabled
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# La souris suit le focus, comme warp-mouse-to-focus dans niri
mouse_warping container
