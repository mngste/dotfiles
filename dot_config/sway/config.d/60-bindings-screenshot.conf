# Remplace le fichier Fedora du même nom (/usr/share/sway/config.d/60-bindings-screenshot.conf).
# Captures d'écran (~/.local/bin/capture) : fichier dans ~/Images/Captures
# et copie dans le presse-papiers
bindsym Print exec ~/.local/bin/capture zone
bindsym Shift+Print exec ~/.local/bin/capture ecran
bindsym $mod+Print exec ~/.local/bin/capture fenetre
