# Apparence Tokyo Night

# Fond d'écran : lien vers une image du dossier assets du dépôt.
# Pour en changer : dot_local/share/backgrounds/symlink_wallpaper.jpg.tmpl
output * bg ~/.local/share/backgrounds/wallpaper.jpg fill

font pango:JetBrainsMono Nerd Font 10
seat seat0 xcursor_theme Bibata-Modern-Classic 24

default_border pixel 2
default_floating_border pixel 2
gaps inner 8
gaps outer 4
smart_gaps on

# classe                 bordure  fond     texte    indicateur bordure-enfant
client.focused           #7aa2f7  #1a1b26  #c0caf5  #2ac3de    #7aa2f7
client.focused_inactive  #3b4261  #1a1b26  #a9b1d6  #3b4261    #3b4261
client.unfocused         #16161e  #16161e  #565f89  #16161e    #16161e
client.urgent            #f7768e  #1a1b26  #c0caf5  #f7768e    #f7768e
