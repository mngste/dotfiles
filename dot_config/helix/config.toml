# ~/.config/helix/config.toml
theme = "tokyonight"

[editor]
line-number = "relative"
mouse = true
true-color = true          # bonnes couleurs même en SSH
color-modes = true         # la barre d'état change de couleur selon le mode
cursorline = true
bufferline = "multiple"
auto-format = true
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false             # montre les fichiers cachés (.env, .config...)

[editor.lsp]
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-type"]

[keys.normal]
C-s = ":w"
esc = ["collapse_selection", "keep_primary_selection"]
